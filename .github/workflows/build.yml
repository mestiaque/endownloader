# Tests and bundles ENDownloader for Ubuntu (.deb, AppImage) and Windows (NSIS installer,
# portable zip). Pushing a tag like v0.2.0 publishes a GitHub Release with the installers
# attached; installed copies of ENDownloader find it through their built-in update check.
name: build

# Full Windows + Linux bundling is slow, so it runs for release tags, pull requests and
# manual runs only — not for every push to master.
on:
  push:
    tags: ["v*"]
  pull_request:
    # Documentation never needs a build.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# A newer run for the same tag/branch cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        # apt on the hosted runner occasionally hangs on a mirror: bound each try and retry.
        # aria2 lets the end-to-end download tests run instead of being skipped.
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            timeout 300 sudo apt-get $APT update &&
            timeout 900 sudo -E apt-get $APT install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
              libayatana-appindicator3-dev libssl-dev libxdo-dev file patchelf aria2 && exit 0
            echo "apt attempt $i failed, retrying…"; sleep 15
          done
          exit 1

      - name: aria2c sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/fetch-sidecars.sh

      # The pnpm version comes from package.json (packageManager); giving it here too is an error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # --release: the bundle step below reuses these compiled crates instead of building twice.
      # One test thread: the aria2 crash/resume test is timing-sensitive under parallel load.
      - run: cargo test --release --workspace -- --test-threads=1

      - name: Bundle
        run: pnpm tauri build --bundles ${{ matrix.bundles }} ${{ runner.os == 'Windows' && '--config src-tauri/tauri.windows.conf.json' || '' }}

      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # The `portable` marker keeps settings and the queue in a `data` folder beside the exe.
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item target/release/endownloader.exe portable/ENDownloader.exe
          Copy-Item src-tauri/binaries/aria2c-x86_64-pc-windows-msvc.exe portable/aria2c.exe
          New-Item -ItemType File -Force -Path portable/portable | Out-Null
          Compress-Archive -Path portable/* -DestinationPath ENDownloader-portable-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: endownloader-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            ENDownloader-portable-windows-x64.zip

  release:
    name: Publish release
    # Publish whatever built (Linux alone is enough), so one broken platform never blocks updates.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [test-and-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Collect files
        run: |
          mkdir -p files
          find out -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*-setup.exe' -o -name '*.zip' \) -exec cp {} files/ \;
          ls -l files
          test -n "$(ls files)"
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
