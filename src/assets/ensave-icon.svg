<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
    <filter id="blobBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#022C22" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fold" gradientUnits="userSpaceOnUse" x1="286" y1="182" x2="374" y2="330">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="0" y1="182" x2="0" y2="330">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="0.8" stop-color="#ECFCCB"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>

    <!-- Letter strokes, reused for depth layers -->
    <g id="strokes" fill="none" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
      <path d="M218 182 H138 V330 H218 M138 256 H204"/>
      <path d="M374 330 V182"/>
      <path d="M286 182 L374 330"/>
    </g>

    <!-- Download arrow (N's left leg) -->
    <path id="dl" d="M274 182 A12 12 0 0 1 298 182 V298 H320 L286 340 L252 298 H274 Z"/>
  </defs>

  <!-- Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Soft colour blobs behind the glass -->
  <g clip-path="url(#clip)" filter="url(#blobBlur)">
    <circle cx="130" cy="120" r="140" fill="#A3E635" opacity="0.6"/>
    <circle cx="410" cy="410" r="160" fill="#22D3EE" opacity="0.6"/>
  </g>

  <!-- Glass panel -->
  <g filter="url(#glassShadow)">
    <rect x="72" y="72" width="368" height="368" rx="84" fill="#FFFFFF" fill-opacity="0.14"
          stroke="url(#glassStroke)" stroke-width="2.5"/>
  </g>
  <path d="M156 72 H356 A84 84 0 0 1 440 156 V200 H72 V156 A84 84 0 0 1 156 72 Z" fill="url(#shine)"/>

  <!-- Subtle 3D: soft shadow + translucent depth -->
  <use href="#strokes" stroke="#022C22" opacity="0.35" transform="translate(0 18)" filter="url(#soft)"/>
  <use href="#strokes" stroke="#065F46" opacity="0.5" transform="translate(0 7)"/>
  <use href="#dl" fill="#065F46" stroke="#065F46" stroke-width="8" stroke-linejoin="round"
       opacity="0.5" transform="translate(0 7)"/>
  <use href="#dl" fill="#022C22" stroke="#022C22" stroke-width="8" stroke-linejoin="round"
       opacity="0.35" transform="translate(0 18)" filter="url(#soft)"/>

  <!-- EN front faces -->
  <g filter="url(#glow)" fill="none" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M218 182 H138 V330 H218 M138 256 H204" stroke="#FFFFFF"/>
    <path d="M374 330 V182" stroke="#FFFFFF"/>
    <!-- Folded ribbon diagonal -->
    <path d="M286 182 L374 330" stroke="url(#fold)"/>
  </g>
  <!-- Glowing download arrow -->
  <use href="#dl" fill="url(#arrow)" stroke="url(#arrow)" stroke-width="8"
       stroke-linejoin="round" filter="url(#glow)"/>
</svg>
